apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenario-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scenario-api
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: scenario-api
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: scenario-api
          image: scenario-api
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false

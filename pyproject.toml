[project]
name = "scenario-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

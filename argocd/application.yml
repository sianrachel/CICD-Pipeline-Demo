apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scenario-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sianrachel/CICD-Pipeline-Demo.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: scenario-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

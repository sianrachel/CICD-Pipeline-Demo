repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: kustomize-build
        name: kustomize renders
        entry: kubectl kustomize k8s
        language: system
        files: ^k8s/
        pass_filenames: false
